<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌦️ Weather Dashboard</h1>
            <p>Discover the weather in your city</p>
        </header>

        <form id="weather-form">
            <input
                type="text"
                id="city"
                placeholder="Enter city name..."
                aria-label="City name"
            >
            <button type="submit" id="search-btn">
                Search
            </button>
        </form>

        <p id="status" role="status" aria-live="polite">
            Enter a city name to check the weather.
        </p>

        <section id="current-weather" class="weather-card" hidden>
            <h2 id="city-name"></h2>
            <p id="weather-condition"></p>
            <p class="temperature">
                <span id="temperature"></span>°C
            </p>
            <p>Today's High: <span id="high-temp"></span>°C</p>
            <p>Today's Low: <span id="low-temp"></span>°C</p>
        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>
            <div id="forecast" class="forecast-container"></div>
        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>

    </div>

    <script src="app.js"></script>

</body>
</html>
